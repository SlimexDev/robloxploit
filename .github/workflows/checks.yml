name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robloxploit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:release
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/robloxploit_test
          DATABASE_SSL: disable
          NODE_ENV: development
      - run: npm audit --omit=dev --audit-level=high
